name: Update ticker directory

on:
  schedule:
    - cron: "0,30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-tickers
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch & build tickers.json
        run: node scripts/update-tickers.mjs

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/tickers.json docs/data/meta.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update ticker directory ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
